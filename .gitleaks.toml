[extend]
useDefault = true

# This is a public Hardhat contract address, not an API key. Keep the exception
# limited to this documented example variable so real credentials stay detected.
[[allowlists]]
description = "Public Hardhat contract addresses in the environment example"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
]
paths = [
  '''^\.env\.hardhat\.example$''',
]
