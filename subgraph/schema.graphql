type Account @entity(immutable: false) {
  id: ID!
  address: Bytes!
  reputation: BigInt!
  reputationInitialized: Boolean!
  winningVotes: BigInt!
  isCurator: Boolean!
  isReviewer: Boolean!
  votesToCurator: BigInt!
  votesToReviewer: BigInt!
  createdIdeaCount: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type Round @entity(immutable: false) {
  id: ID!
  startTime: BigInt!
  endTime: BigInt!
  active: Boolean!
  ended: Boolean!
  totalVotes: BigInt!
  winningIdeaId: BigInt!
  winningVotes: BigInt!
  ideaIds: [BigInt!]!
  pledgeFeeBps: BigInt!
  totalPledged: BigInt!
  grossFunding: BigInt!
  roundFee: BigInt!
  netFunding: BigInt!
  settled: Boolean!
  feeFinalized: Boolean!
  cancelled: Boolean!
  grantRefundActivated: Boolean!
  refundedAmount: BigInt!
  fundingReserved: BigInt!
  distributedAmount: BigInt!
  backerMilestones: Boolean!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type Idea @entity(immutable: false) {
  id: ID!
  author: Bytes
  authorAccount: Account
  title: String!
  description: String!
  link: String!
  createdAt: BigInt!
  totalVotes: BigInt!
  status: Int!
  isLowQuality: Boolean!
  authorStake: BigInt!
  minimumNetFunding: BigInt!
  milestonePlanURI: String!
  milestonePlanHash: Bytes!
  reviewCount: Int!
  roundId: BigInt
  round: Round
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type Vote @entity(immutable: true) {
  id: ID!
  roundId: BigInt!
  ideaId: BigInt!
  voter: Bytes!
  voterAccount: Account!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type Pledge @entity(immutable: true) {
  id: ID!
  roundId: BigInt!
  round: Round!
  ideaId: BigInt!
  idea: Idea!
  voter: Bytes!
  voterAccount: Account!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type PledgeRefund @entity(immutable: true) {
  id: ID!
  roundId: BigInt!
  round: Round!
  ideaId: BigInt!
  idea: Idea!
  voter: Bytes!
  voterAccount: Account!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type Review @entity(immutable: true) {
  id: ID!
  ideaId: BigInt!
  idea: Idea!
  reviewer: Bytes!
  reviewerAccount: Account!
  comment: String!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type GrantPayout @entity(immutable: false) {
  id: ID!
  roundId: BigInt!
  round: Round!
  ideaId: BigInt!
  idea: Idea
  author: Bytes
  authorAccount: Account
  totalGrant: BigInt!
  released: BigInt!
  initialClaimed: Boolean!
  inProcessPaid: Boolean!
  completionPaid: Boolean!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type MilestoneRequest @entity(immutable: false) {
  id: ID!
  roundId: BigInt!
  round: Round!
  ideaId: BigInt!
  idea: Idea
  stage: Int!
  requestId: BigInt!
  metadataURI: String!
  details: String!
  submittedAt: BigInt!
  lastRejectedAt: BigInt!
  approvals: Int!
  rejections: Int!
  maxReviewers: Int!
  approvalThreshold: Int!
  active: Boolean!
  lastReviewedAt: BigInt
  lastReviewer: Bytes
  lastReviewApproved: Boolean
  proofHash: Bytes!
  backerApproveWeight: BigInt!
  backerRejectWeight: BigInt!
  backerApproveCount: BigInt!
  graceDeadline: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type Distribution @entity(immutable: true) {
  id: ID!
  roundId: BigInt!
  ideaId: BigInt!
  amount: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type ProtocolStats @entity(immutable: false) {
  id: ID!
  totalTreasury: BigInt!
  totalDeposited: BigInt!
  totalDistributed: BigInt!
  distributionCount: BigInt!
  totalIdeas: BigInt!
  totalRounds: BigInt!
  activeRounds: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

# Event-derived revenue, not total custody, APY or investor ownership.
type ProtocolRevenueState @entity(immutable: false) {
  id: ID!
  currentPolicyKnown: Boolean!
  currentTreasury: Bytes!
  currentShareBps: BigInt!
  scheduled: Boolean!
  scheduledTreasury: Bytes!
  scheduledShareBps: BigInt!
  readyAt: BigInt!
  accrued: BigInt!
  claimed: BigInt!
  pending: BigInt!
  firstObservedBlock: BigInt!
  updatedAtBlock: BigInt!
  receivers: [ProtocolRevenueReceiver!]! @derivedFrom(field: "pool")
  rounds: [FundingRoundRevenue!]! @derivedFrom(field: "pool")
}

type FundingRoundRevenue @entity(immutable: false) {
  id: ID!
  pool: ProtocolRevenueState!
  round: Round!
  roundId: BigInt!
  treasury: ProtocolRevenueReceiver
  treasuryAddress: Bytes!
  shareBps: BigInt!
  baseObserved: Boolean!
  eligibleFee: BigInt!
  totalFee: BigInt!
  accrued: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ProtocolRevenueReceiver @entity(immutable: false) {
  id: ID!
  pool: ProtocolRevenueState!
  token: Bytes
  discoveryStatus: String!
  templateStarted: Boolean!
  payeeCount: Int!
  accrued: BigInt!
  claimed: BigInt!
  pending: BigInt!
  observedCollected: BigInt!
  observedReleased: BigInt!
  firstObservedBlock: BigInt!
  trackingStartedAtBlock: BigInt
  updatedAtBlock: BigInt!
  beneficiaries: [RevenueBeneficiary!]! @derivedFrom(field: "treasury")
}

type RevenueBeneficiary @entity(immutable: false) {
  id: ID!
  treasury: ProtocolRevenueReceiver!
  address: Bytes!
  shareBps: BigInt!
  observedReleased: BigInt!
  updatedAtBlock: BigInt!
}

type RevenueEvent @entity(immutable: true) {
  id: ID!
  kind: String!
  pool: ProtocolRevenueState!
  treasury: ProtocolRevenueReceiver
  round: FundingRoundRevenue
  payee: Bytes
  amount: BigInt
  shareBps: BigInt
  readyAt: BigInt
  eligibleFee: BigInt
  totalFee: BigInt
  txHash: Bytes!
  logIndex: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
}
