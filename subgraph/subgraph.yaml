specVersion: 1.0.0
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: VotingSystem
    network: sepolia
    source:
      address: "0x34B611EFEc9ce93d5443Bfcf1fc7D10640cfb943"
      abi: VotingSystemUpgradeable
      startBlock: 10267348
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Round
        - Vote
      abis:
        - name: VotingSystemUpgradeable
          file: ./abis/DAO/VotingSystemUpgradeable.json
      eventHandlers:
        - event: VotingRoundStarted(indexed uint256,uint256[],uint256,uint256)
          handler: handleVotingRoundStarted
        - event: VotingRoundEnded(indexed uint256,uint256,uint256)
          handler: handleVotingRoundEnded
        - event: VoteCast(indexed address,indexed uint256,indexed uint256,uint256)
          handler: handleVoteCast
      file: ./src/mapping.ts

  - kind: ethereum
    name: IdeaRegistry
    network: sepolia
    source:
      address: "0xFf4F0AEeCe93847d68E0FF169142E64f613850BE"
      abi: IdeaRegistryUpgradeable
      startBlock: 10267341
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Idea
        - Review
      abis:
        - name: IdeaRegistryUpgradeable
          file: ./abis/DAO/IdeaRegistryUpgradeable.json
      eventHandlers:
        - event: IdeaCreated(indexed uint256,indexed address,string)
          handler: handleIdeaCreated
        - event: IdeaStatusUpdated(indexed uint256,uint8)
          handler: handleIdeaStatusUpdated
        - event: IdeaMarkedLowQuality(indexed uint256,indexed address)
          handler: handleIdeaMarkedLowQuality
        - event: ReviewAdded(indexed uint256,indexed address)
          handler: handleReviewAdded
      file: ./src/mapping.ts

  - kind: ethereum
    name: FundingPool
    network: sepolia
    source:
      address: "0x822e853dB65B288FE01Ca76Ed6e8B4895070F32D"
      abi: FundingPoolUpgradeable
      startBlock: 10267346
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Idea
        - Distribution
      abis:
        - name: FundingPoolUpgradeable
          file: ./abis/DAO/FundingPoolUpgradeable.json
      eventHandlers:
        - event: AuthorStakeDeposited(indexed uint256,indexed address,uint256)
          handler: handleAuthorStakeDeposited
        - event: AuthorStakeSlashed(indexed uint256,uint256)
          handler: handleAuthorStakeSlashed
        - event: IdeaFundsReserved(indexed uint256,indexed uint256,uint256)
          handler: handleIdeaFundsReserved
        - event: FundsDistributed(indexed uint256,indexed uint256,uint256)
          handler: handleFundsDistributed
      file: ./src/mapping.ts

  - kind: ethereum
    name: GrantManager
    network: sepolia
    source:
      address: "0x0efEF5542f41e705cdf402070268C42473281FEA"
      abi: GrantManagerUpgradeable
      startBlock: 10267350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - GrantPayout
        - MilestoneRequest
      abis:
        - name: GrantManagerUpgradeable
          file: ./abis/DAO/GrantManagerUpgradeable.json
      eventHandlers:
        - event: RoundFunded(indexed uint256,indexed uint256,uint256)
          handler: handleRoundFunded
        - event: MilestoneProofSubmitted(indexed uint256,indexed uint256,indexed uint8,uint256)
          handler: handleMilestoneProofSubmitted
        - event: MilestoneReviewed(indexed uint256,indexed uint8,indexed address,bool)
          handler: handleMilestoneReviewed
        - event: MilestoneRejected(indexed uint256,indexed uint256,indexed uint8,uint256)
          handler: handleMilestoneRejected
        - event: MilestoneApproved(indexed uint256,indexed uint256,indexed uint8,uint256)
          handler: handleMilestoneApproved
      file: ./src/mapping.ts

  - kind: ethereum
    name: VoterProgression
    network: sepolia
    source:
      address: "0x4f654ED420Bd2F8EB01060f48b9bE8fAb787c94f"
      abi: VoterProgressionUpgradeable
      startBlock: 10267339
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
      abis:
        - name: VoterProgressionUpgradeable
          file: ./abis/extensions/VoterProgressionUpgradeable.json
      eventHandlers:
        - event: WinningVoteRegistered(indexed address,uint256)
          handler: handleWinningVoteRegistered
        - event: RoleGranted(indexed address,bytes32)
          handler: handleRoleGranted
        - event: ProgressionReset(indexed address)
          handler: handleProgressionReset
      file: ./src/mapping.ts

  - kind: ethereum
    name: ReputationSystem
    network: sepolia
    source:
      address: "0x51d08e9871e06763E7f34BCea4D359DC217DC6A5"
      abi: ReputationSystemUpgradeable
      startBlock: 10267337
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
      abis:
        - name: ReputationSystemUpgradeable
          file: ./abis/extensions/ReputationSystemUpgradeable.json
      eventHandlers:
        - event: ReputationInitialized(indexed address)
          handler: handleReputationInitialized
        - event: ReputationIncreased(indexed address,uint256)
          handler: handleReputationIncreased
        - event: ReputationDecreased(indexed address,uint256,uint256)
          handler: handleReputationDecreased
        - event: ReputationSet(indexed address,uint256,uint256)
          handler: handleReputationSet
        - event: ReputationDeinitialized(indexed address)
          handler: handleReputationDeinitialized
      file: ./src/mapping.ts
