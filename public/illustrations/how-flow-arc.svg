<svg width="100%" viewBox="0 0 720 650" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>BERT V2.3 refundable pledge and backer milestone flow</title>
  <desc>Author bond and plan commitment lead to a 14-day pledge round. Losing pledges are refunded. A viable winner claims 20 percent, then winning backers approve two 40 percent proof stages.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827" /><stop offset="1" stop-color="#17253b" /></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b4bc4" /><stop offset="1" stop-color="#2d247a" /></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e" /><stop offset="1" stop-color="#164e63" /></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a5b11" /><stop offset="1" stop-color="#713f12" /></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#93a4ba" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .heading { fill: #e7eef8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; }
      .label { fill: #dce8f7; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 650; }
      .copy { fill: #aabbd0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
      .eyebrow { fill: #7dd3fc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
      .arrow { fill: none; stroke: #93a4ba; stroke-width: 1.5; marker-end: url(#arrow); }
      .alert { fill: #fecdd3; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
    </style>
  </defs>
  <rect width="720" height="650" rx="22" fill="url(#surface)"/>
  <text x="34" y="42" class="eyebrow">BERT V2.3 ON ARC TESTNET</text>
  <text x="34" y="69" class="heading" font-size="21">Refundable pledge funding, then backer-controlled delivery</text>
  <rect x="34" y="100" width="150" height="112" rx="16" fill="url(#violet)" stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="52" y="127" class="eyebrow">01 · AUTHOR</text><text x="52" y="153" class="label">Submit + commit plan</text><text x="52" y="176" class="copy">50 USDC bond</text><text x="52" y="194" class="copy">Target + immutable URI/hash</text>
  <line x1="186" y1="156" x2="218" y2="156" class="arrow"/>
  <rect x="220" y="100" width="152" height="112" rx="16" fill="url(#cyan)" stroke="#5eead4" stroke-opacity=".55"/>
  <text x="238" y="127" class="eyebrow">02 · ROUND</text><text x="238" y="153" class="label">30 eligible ideas</text><text x="238" y="176" class="copy">14-day USDC pledge window</text><text x="238" y="194" class="copy">One pledge per wallet / round</text>
  <line x1="374" y1="156" x2="406" y2="156" class="arrow"/>
  <rect x="408" y="100" width="278" height="112" rx="16" fill="#162235" stroke="#64748b" stroke-opacity=".7"/>
  <text x="426" y="127" class="eyebrow">03 · SETTLEMENT</text><text x="426" y="153" class="label">Highest viable idea wins</text><text x="426" y="176" class="copy">Post-fee target reached + 3 distinct backers</text><text x="426" y="194" class="copy">All losing pledges become pull-refundable</text>
  <path d="M547 214 L547 254 L200 254 L200 282" class="arrow"/>
  <text x="390" y="243" class="copy" text-anchor="middle">winner's own escrow enters GrantManager</text>
  <rect x="34" y="282" width="166" height="114" rx="16" fill="url(#gold)" stroke="#fbbf24" stroke-opacity=".6"/>
  <text x="52" y="309" class="eyebrow">04 · INITIAL CLAIM</text><text x="52" y="336" class="label">20% gross release</text><text x="52" y="359" class="copy">19% to author at 5% fee</text><text x="52" y="377" class="copy">1% finalizes to reserve</text>
  <line x1="202" y1="339" x2="235" y2="339" class="arrow"/>
  <rect x="237" y="282" width="216" height="114" rx="16" fill="url(#cyan)" stroke="#5eead4" stroke-opacity=".55"/>
  <text x="255" y="309" class="eyebrow">05 · BACKER REVIEW</text><text x="255" y="336" class="label">Proof is submitted onchain</text><text x="255" y="359" class="copy">Only winning pledgers vote by weight</text><text x="255" y="377" class="copy">Author is excluded</text>
  <line x1="455" y1="339" x2="487" y2="339" class="arrow"/>
  <rect x="489" y="282" width="197" height="114" rx="16" fill="url(#violet)" stroke="#a78bfa" stroke-opacity=".55"/>
  <text x="507" y="309" class="eyebrow">06 · DECISION</text><text x="507" y="336" class="label">40% pledge quorum</text><text x="507" y="359" class="copy">2/3 approve participating weight</text><text x="507" y="377" class="copy">+ 3 verified backers approve</text>
  <line x1="360" y1="398" x2="360" y2="443" class="arrow"/>
  <rect x="156" y="445" width="408" height="126" rx="18" fill="#111e30" stroke="#38bdf8" stroke-opacity=".5"/>
  <text x="178" y="475" class="eyebrow">07 · TWO CONTROLLED DELIVERY STAGES</text><text x="178" y="503" class="label">In-process proof → 40% gross release</text><text x="178" y="528" class="label">Completion proof → final 40% gross release</text><text x="178" y="551" class="copy">Each proof has a 14-day review. The vote remains open until its deadline.</text>
  <rect x="34" y="594" width="652" height="32" rx="10" fill="#221826" stroke="#fb7185" stroke-opacity=".45"/>
  <text x="360" y="615" class="alert" text-anchor="middle">No quorum: one 7-day grace. Silence, a missed deadline, or a second rejection never pays out; unreleased escrow becomes refundable.</text>
</svg>
