<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
    <style>
      .title { font: 600 30px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 22px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .small { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <text x="800" y="52" text-anchor="middle" class="title">BERT Protocol Flow</text>
  <text x="800" y="84" text-anchor="middle" class="small">Anyone can start and end voting rounds when conditions are met</text>

  <line x1="150" y1="250" x2="1450" y2="250" stroke="#cbd5e1" stroke-width="2" />

  <line x1="260" y1="250" x2="340" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="450" y1="250" x2="530" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="640" y1="250" x2="720" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="830" y1="250" x2="910" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="1020" y1="250" x2="1100" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)" />

  <g transform="translate(140,190)">
    <rect width="120" height="44" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="60" y="29" text-anchor="middle" class="label">User</text>
    <text x="60" y="88" text-anchor="middle" class="note">Get BTK</text>
  </g>

  <g transform="translate(330,190)">
    <rect width="120" height="44" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="60" y="29" text-anchor="middle" class="label">Faucet</text>
    <text x="60" y="88" text-anchor="middle" class="note">Claim test BTK</text>
  </g>

  <g transform="translate(520,190)">
    <rect width="120" height="44" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="60" y="29" text-anchor="middle" class="label">Ideas</text>
    <text x="60" y="88" text-anchor="middle" class="note">Submit proposal</text>
  </g>

  <g transform="translate(710,190)">
    <rect width="120" height="44" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="60" y="29" text-anchor="middle" class="label">Voting</text>
    <text x="60" y="88" text-anchor="middle" class="note">Stake and vote</text>
  </g>

  <g transform="translate(900,190)">
    <rect width="120" height="44" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="60" y="29" text-anchor="middle" class="label">Pool</text>
    <text x="60" y="88" text-anchor="middle" class="note">Stake enters pool</text>
  </g>

  <g transform="translate(1090,190)">
    <rect width="210" height="44" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="105" y="29" text-anchor="middle" class="label">Grant Manager</text>
    <text x="105" y="88" text-anchor="middle" class="note">Distribute grants</text>
  </g>

  <path d="M430 340C600 430 880 430 1040 340" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1060 340C1180 420 1330 420 1420 340" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <text x="730" y="468" text-anchor="middle" class="small">During voting, staked BTK is routed to Funding Pool</text>
  <text x="1280" y="496" text-anchor="middle" class="small">Winner receives grant payout</text>
</svg>
